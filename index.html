<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Five small, science-backed habits that level up your life — sleep, movement, reading, journaling and connection. Available in Korean, English, Japanese and Spanish.">
<title>Level Up Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: a game-style character sheet. Hero with a 5-step "stat staircase", then one wide row per habit, then the quest log. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#11182B; --muted:#5B6479; --line:#DCE1EA;
  --xp:#F2B10C; --xp-ink:#3A2A00;
  --c-sleep:#4D5BD6; --c-move:#F25C3B; --c-read:#11978A; --c-reflect:#8E55DE; --c-connect:#DB3F84;
  --display:"Bricolage Grotesque","Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans KR","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111E; --surface:#151C2D; --ink:#E9EDF6; --muted:#9AA4BA; --line:#273049;
  --xp:#F5C23A; --xp-ink:#2A1F00;
  --c-sleep:#8590F2; --c-move:#FF8466; --c-read:#3CC4B4; --c-reflect:#B38BF2; --c-connect:#F26FA8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111E; --surface:#151C2D; --ink:#E9EDF6; --muted:#9AA4BA; --line:#273049;
  --xp:#F5C23A; --xp-ink:#2A1F00;
  --c-sleep:#8590F2; --c-move:#FF8466; --c-read:#3CC4B4; --c-reflect:#B38BF2; --c-connect:#F26FA8;
  color-scheme:dark}
:lang(ja){--body:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif;--display:"Bricolage Grotesque","Noto Sans JP",system-ui,sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--xp);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.02em;font-size:17px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;background:var(--xp);clip-path:polygon(50% 0,100% 100%,0 100%)}
.pill{font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.langs{margin-left:auto;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:700;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Hero */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:end;padding-block:64px 40px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.2rem);font-weight:800;letter-spacing:-.02em}
.hero p.sub{margin-top:20px;max-width:34em;color:var(--muted);font-size:1.08rem}
.cta{margin-top:28px;display:inline-flex;align-items:center;gap:10px;border:0;background:var(--xp);color:var(--xp-ink);font-weight:800;padding:13px 22px;border-radius:999px;font-size:1rem}
.cta span{font-family:var(--mono)}
.stairs{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:8px;height:300px}
.step{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.step .blk{border-radius:10px 10px 4px 4px;background:color-mix(in srgb,var(--c) 22%,var(--bg));border:2px solid color-mix(in srgb,var(--c) 45%,transparent);transition:background .35s,transform .35s;position:relative}
.step.on .blk{background:var(--c);border-color:var(--c);transform:translateY(-6px)}
.step .blk::after{content:"+20";position:absolute;top:8px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--bg);opacity:0;transition:opacity .35s}
.step.on .blk::after{opacity:1}
.step small{display:block;text-align:center;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 66 days */
.fact .wrap{padding-block:8px 40px}
.fact-card{display:flex;gap:28px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding-block:22px}
.big66{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,8vw,5.2rem);line-height:1;letter-spacing:-.03em}
.big66 small{font-size:.32em;margin-left:6px;letter-spacing:0;color:var(--muted)}
.fact-card .t{min-width:0;flex:1 1 260px}
.fact-card .t b{display:block;font-size:1.15rem}
.fact-card .t span{color:var(--muted);font-size:.92rem}
.track66{flex:1 1 280px;display:grid;grid-template-columns:repeat(22,1fr);gap:3px;min-width:0}
.track66 i{aspect-ratio:1;border-radius:2px;background:var(--line);max-width:100%}
.track66 i.f{background:var(--xp)}

/* Habit rows */
.habits .wrap{display:flex;flex-direction:column;gap:14px;padding-block:8px 56px}
.habit{display:grid;grid-template-columns:170px minmax(0,1fr) 170px;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;position:relative;overflow:hidden}
.habit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);transition:width .3s}
.habit.on::before{width:6px}
.stat{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--c)}
.num{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.05;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.numl{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.35}
.habit h3{font-size:1.5rem;font-weight:800}
.habit .line{font-weight:700;margin-top:4px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:14px}
.dl dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dl dd{margin:0;font-size:.95rem;max-width:36em}
.toggle{border:2px solid var(--c);background:transparent;border-radius:12px;padding:12px 14px;font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:background .2s,color .2s}
.toggle .box{width:18px;height:18px;border:2px solid var(--c);border-radius:5px;flex:none;display:grid;place-items:center}
.habit.on .toggle{background:var(--c);color:var(--bg)}
.habit.on .toggle .box{border-color:var(--bg);background:var(--bg)}
.habit.on .toggle .box::after{content:"";width:8px;height:5px;border-left:2.5px solid var(--c);border-bottom:2.5px solid var(--c);transform:rotate(-45deg) translate(1px,-1px)}

/* Quest */
.quest{background:var(--ink);color:var(--bg)}
.quest .wrap{padding-block:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.quest h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800}
.quest p{color:color-mix(in srgb,var(--bg) 70%,var(--ink));margin-top:10px}
.meter-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;font-weight:600;margin-bottom:8px;font-variant-numeric:tabular-nums}
.meter{height:22px;border-radius:999px;background:color-mix(in srgb,var(--bg) 14%,var(--ink));overflow:hidden;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px}
.meter i{border-radius:999px;background:transparent;transition:background .3s}
.meter i.f{background:var(--xp)}
.qrow{margin-top:26px}
.reset{margin-top:24px;background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,var(--ink));color:var(--bg);border-radius:999px;padding:7px 16px;font-size:.88rem}
.msg{font-weight:800;color:var(--xp)!important;min-height:1.6em}

footer .wrap{padding-block:40px 56px;display:flex;flex-wrap:wrap;gap:24px 48px;justify-content:space-between;color:var(--muted);font-size:.88rem}
footer h4{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
footer ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
footer a{color:var(--ink);text-underline-offset:3px}
.tag{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--ink);max-width:16em}

/* Hero buttons */
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.cta-row .cta{margin-top:0}
.cta.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:11px 20px}

/* Discussion board */
.board .wrap{padding-block:64px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:44px;align-items:start}
.board h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800}
.board .lead{color:var(--muted);margin-top:10px}
.compose{margin-top:24px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.compose label{display:grid;gap:6px}
.compose label>span{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea.fld{min-height:120px;resize:vertical}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:800;border-radius:999px;padding:11px 18px}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:.88rem;color:var(--muted)}
.note:empty{display:none}
.note.warn{color:var(--c-move)}
.ro{margin-top:20px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.post{padding-block:20px;border-bottom:1px solid var(--line);display:grid;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--c,var(--muted));border:1.5px solid color-mix(in srgb,var(--c,var(--muted)) 55%,transparent);border-radius:999px;padding:2px 9px}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700}
.who img{width:22px;height:22px;border-radius:50%;flex:none}
.post h4{margin:0;font-family:var(--display);font-size:1.2rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.pbody{white-space:pre-wrap;overflow-wrap:anywhere;max-width:62ch}
.acts{display:flex;flex-wrap:wrap;gap:4px 16px}
.link{border:0;background:transparent;padding:4px 0;font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link[data-armed]{color:var(--c-move)}
.replies{margin-left:6px;padding-left:16px;border-left:2px solid var(--line);display:grid;gap:14px;margin-top:4px}
.reply{display:grid;gap:3px;min-width:0}
.reply p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.rform{display:flex;gap:8px}
.rform .btn{padding:9px 16px;flex:none}
.bstate{padding-block:24px;color:var(--muted)}
.bstate:empty{display:none}

@media (max-width:860px){
  .board .wrap{grid-template-columns:1fr;gap:28px;padding-block:44px}
  .hero .wrap{grid-template-columns:1fr;gap:32px;padding-block:40px 28px}
  .stairs{height:190px}
  .habit{grid-template-columns:1fr;gap:16px;padding:22px 20px}
  .habit .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .quest .wrap{grid-template-columns:1fr;gap:24px}
}
@media (max-width:520px){ .dl{grid-template-columns:1fr} .track66{grid-template-columns:repeat(11,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>LEVEL UP</div>
    <span class="pill" id="pill">LV 0 · 0 XP</span>
    <nav class="langs" aria-label="Language">
      <button data-l="ko">한국어</button><button data-l="en">EN</button><button data-l="ja">日本語</button><button data-l="es">ES</button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <div class="cta-row">
        <button class="cta" id="cta"><b data-t="cta"></b><span>→</span></button>
        <button class="cta ghost" id="toBoard"><b data-b="title"></b></button>
      </div>
    </div>
    <div class="stairs" id="stairs" aria-hidden="true"></div>
  </div>
</section>

<section class="fact">
  <div class="wrap">
    <div class="fact-card">
      <div class="big66">66<small data-t="days"></small></div>
      <div class="t"><b data-t="f66label"></b><span data-t="f66note"></span></div>
      <div class="track66" id="track66" aria-hidden="true"></div>
    </div>
  </div>
</section>

<section class="habits"><div class="wrap" id="habits"></div></section>

<section class="quest" id="quest">
  <div class="wrap">
    <div>
      <h2 data-t="qTitle"></h2>
      <p data-t="qSub"></p>
      <p class="msg" id="msg"></p>
      <button class="reset" id="reset" data-t="reset"></button>
    </div>
    <div>
      <div class="qrow">
        <div class="meter-label"><span data-t="todayXP"></span><span id="xpNum">0 / 100</span></div>
        <div class="meter" id="meterToday"></div>
      </div>
      <div class="qrow">
        <div class="meter-label"><span data-t="logged"></span><span id="dayNum">0 / 66</span></div>
        <p style="margin-top:0;font-size:.88rem" data-t="loggedNote"></p>
      </div>
    </div>
  </div>
</section>

<section class="board" id="board">
  <div class="wrap">
    <div>
      <h2 data-b="title"></h2>
      <p class="lead" data-b="sub"></p>
      <p class="note ro" id="setupNote" hidden data-b="setup"></p>
    </div>
    <div style="min-width:0"><div id="disqus_thread"></div></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="tag" data-t="tagline"></p>
    <div>
      <h4 data-t="srcTitle"></h4>
      <ul>
        <li><a href="https://doi.org/10.1002/ejsp.674" target="_blank" rel="noopener">Lally et al. (2010), European Journal of Social Psychology</a></li>
        <li><a href="https://www.who.int/news-room/fact-sheets/detail/physical-activity" target="_blank" rel="noopener">WHO — Physical activity</a></li>
        <li><a href="https://www.cdc.gov/sleep/about/index.html" target="_blank" rel="noopener">CDC — About sleep</a></li>
        <li><a href="https://www.adultdevelopmentstudy.org/" target="_blank" rel="noopener">Harvard Study of Adult Development</a></li>
      </ul>
    </div>
  </div>
</footer>

<script>
const IDS=["sleep","move","read","reflect","connect"];
const T={
ko:{eyebrow:"인생 레벨업 가이드",h1:"작은 습관 다섯 개로<br>인생을 레벨업",sub:"거창한 결심보다 매일 반복하는 작은 행동이 삶을 바꿉니다. 과학이 뒷받침하는 다섯 가지 습관을 오늘부터 시작해 보세요.",cta:"오늘의 퀘스트 시작",days:"일",f66label:"습관이 자리 잡기까지 걸리는 평균 기간",f66note:"런던대(UCL) 연구 · 사람에 따라 18~254일",whyL:"왜 효과가 있을까",startL:"가장 작은 시작",done:"오늘 했어요",doneOn:"완료 · +20 XP",qTitle:"오늘의 퀘스트",qSub:"해낸 습관을 위에서 체크하세요. 기록은 이 브라우저에만 저장됩니다.",todayXP:"오늘의 경험치",logged:"습관이 자리 잡기까지",loggedNote:"3개 이상 해낸 날을 하루로 셉니다.",reset:"오늘 기록 초기화",srcTitle:"출처",tagline:"완벽한 하루보다 꾸준한 하루.",m:["첫 번째 습관부터 체크해 보세요.","좋은 출발이에요!","절반 가까이 왔어요.","오늘은 기록되는 날! 계속 가요.","하나만 더!","오늘 퀘스트 완료! 레벨 업!"],
h:{sleep:["에너지","충분히 자기","하루 7시간 이상, 같은 시간에 자고 일어나기","수면은 기억을 정리하고 감정을 회복시키는 시간입니다. 잠이 부족하면 집중력과 판단력이 가장 먼저 떨어집니다.","오늘 밤, 잠들기 30분 전 휴대폰 내려놓기","7h+","성인 권장 수면 시간"],
move:["체력","매일 움직이기","숨이 조금 찰 정도로 30분 걷기","규칙적인 운동은 심장병·당뇨 위험을 낮추고 불안과 우울감도 덜어 줍니다.","엘리베이터 대신 계단, 점심 후 10분 산책","150분","WHO 주간 최소 권장 운동량"],

const KEY="levelup-v1";
let S={lang:null,log:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object")S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toLocaleDateString("en-CA");
const todayDone=()=>S.log[today()]||[];

function pickLang(){
  const h=location.hash.slice(1);
  if(T[h])return h;
  if(S.lang&&T[S.lang])return S.lang;
  const n=(navigator.language||"en").slice(0,2);
  return T[n]?n:"en";
}
let L=pickLang();

// Build static structure
const stairs=document.getElementById("stairs");
const habitsEl=document.getElementById("habits");
IDS.forEach((id,i)=>{
  const st=document.createElement("div");st.className="step";st.style.setProperty("--c",`var(--c-${id})`);st.id="st-"+id;
  st.innerHTML=`<div class="blk" style="height:${(i+1)*18}%"></div><small></small>`;stairs.appendChild(st);
  const a=document.createElement("article");a.className="habit";a.id="h-"+id;a.style.setProperty("--c",`var(--c-${id})`);
  a.innerHTML=`<div class="head"><div class="stat"></div><div class="num"></div><div class="numl"></div></div>
  <div style="min-width:0"><h3></h3><p class="line"></p><dl class="dl"><div><dt class="wl"></dt><dd class="why"></dd></div><div><dt class="sl"></dt><dd class="start"></dd></div></dl></div>
  <button class="toggle" id="tg-${id}" aria-pressed="false"><span class="box"></span><span class="tl"></span></button>`;
  habitsEl.appendChild(a);
  a.querySelector(".toggle").addEventListener("click",()=>toggle(id));
});
const tr=document.getElementById("track66");for(let i=0;i<66;i++)tr.appendChild(document.createElement("i"));
const mt=document.getElementById("meterToday");for(let i=0;i<5;i++)mt.appendChild(document.createElement("i"));

function toggle(id){
  const d=today();const arr=new Set(S.log[d]||[]);
  arr.has(id)?arr.delete(id):arr.add(id);
  S.log[d]=[...arr];if(!S.log[d].length)delete S.log[d];save();render();
}
document.getElementById("reset").addEventListener("click",()=>{delete S.log[today()];save();render()});
document.getElementById("cta").addEventListener("click",()=>document.getElementById("habits").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;S.lang=L;save();if(location.hash!=="#"+L)location.hash=L;render()}));
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(T[h]){L=h;S.lang=L;save();render()}});

function render(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t[el.dataset.t]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  const done=todayDone();
  IDS.forEach(id=>{
    const h=t.h[id],a=document.getElementById("h-"+id),on=done.includes(id);
    a.querySelector(".stat").textContent=h[0];a.querySelector(".num").textContent=h[5];a.querySelector(".numl").textContent=h[6];
    a.querySelector("h3").textContent=h[1];a.querySelector(".line").textContent=h[2];
    a.querySelector(".wl").textContent=t.whyL;a.querySelector(".why").textContent=h[3];
    a.querySelector(".sl").textContent=t.startL;a.querySelector(".start").textContent=h[4];
    a.querySelector(".tl").textContent=on?t.doneOn:t.done;
    a.classList.toggle("on",on);a.querySelector(".toggle").setAttribute("aria-pressed",on);
    const st=document.getElementById("st-"+id);st.classList.toggle("on",on);st.querySelector("small").textContent=h[0];
  });
  const n=done.length;
  document.getElementById("pill").textContent=`LV ${n} · ${n*20} XP`;
  document.getElementById("xpNum").textContent=`${n*20} / 100`;
  [...mt.children].forEach((el,i)=>el.classList.toggle("f",i<n));
  document.getElementById("msg").textContent=t.m[n];
  const days=Object.values(S.log).filter(v=>v.length>=3).length;
  document.getElementById("dayNum").textContent=`${Math.min(days,66)} / 66`;
  [...tr.children].forEach((el,i)=>el.classList.toggle("f",i<days));
  boardText();
}
